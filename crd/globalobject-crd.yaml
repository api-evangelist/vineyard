apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globalobjects.k8s.v6d.io
spec:
  group: k8s.v6d.io
  names:
    kind: GlobalObject
    listKind: GlobalObjectList
    plural: globalobjects
    singular: globalobject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            GlobalObject represents distributed vineyard objects whose metadata is
            stored in etcd and is accessible across the entire vineyard cluster.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: GlobalObjectSpec defines the desired state of a GlobalObject
              properties:
                id:
                  type: string
                  description: The vineyard ObjectID of this global object
                name:
                  type: string
                  description: Human-readable name for the object
                signature:
                  type: string
                  description: The object signature
                typename:
                  type: string
                  description: The type name of the stored object
                members:
                  type: array
                  description: List of LocalObject IDs that compose this global object
                  items:
                    type: string
            status:
              type: object
              description: GlobalObjectStatus defines the observed state of GlobalObject
              properties:
                state:
                  type: string
                  description: Current state of the global object
