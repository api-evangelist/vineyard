apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operations.k8s.v6d.io
spec:
  group: k8s.v6d.io
  names:
    kind: Operation
    listKind: OperationList
    plural: operations
    singular: operation
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Operation defines configurable pluggable drivers for inter-workload data
            operations including assembly, repartition, and data migration between
            vineyard instances.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: OperationSpec defines the desired operation
              properties:
                name:
                  type: string
                  description: Name of the operation (e.g., assembly, repartition)
                type:
                  type: string
                  description: Operation type
                require:
                  type: string
                  description: Required object ID or name for the operation
                target:
                  type: string
                  description: Target object or endpoint for the operation
                timeoutSeconds:
                  type: integer
                  description: Timeout in seconds for the operation
            status:
              type: object
              properties:
                state:
                  type: string
                objectID:
                  type: string
