apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sidecars.k8s.v6d.io
spec:
  group: k8s.v6d.io
  names:
    kind: Sidecar
    listKind: SidecarList
    plural: sidecars
    singular: sidecar
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Sidecar is used for configuring and managing the vineyard sidecar container
            that is injected alongside application containers to provide shared memory access.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: SidecarSpec defines the desired sidecar configuration
              properties:
                replicas:
                  type: integer
                  description: Number of replicas for the sidecar
                vineyard:
                  type: object
                  description: VineyardConfig for the sidecar container
                  properties:
                    image:
                      type: string
                    memory:
                      type: string
                    socket:
                      type: string
                metric:
                  type: object
                  properties:
                    enable:
                      type: boolean
                    image:
                      type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
