apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recovers.k8s.v6d.io
spec:
  group: k8s.v6d.io
  names:
    kind: Recover
    listKind: RecoverList
    plural: recovers
    singular: recover
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Recover restores vineyard objects from a previous backup stored in a
            Kubernetes PersistentVolume.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                backupName:
                  type: string
                  description: Name of the Backup resource to restore from
                backupNamespace:
                  type: string
                  description: Namespace of the Backup resource
            status:
              type: object
              properties:
                state:
                  type: string
