apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: localobjects.k8s.v6d.io
spec:
  group: k8s.v6d.io
  names:
    kind: LocalObject
    listKind: LocalObjectList
    plural: localobjects
    singular: localobject
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            LocalObject declaratively defines local vineyard objects stored in a
            single Vineyard instance. Metadata is stored only locally in vineyard.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: LocalObjectSpec defines the desired state of a LocalObject
              properties:
                id:
                  type: string
                  description: The vineyard ObjectID of this local object
                name:
                  type: string
                  description: Human-readable name for the object
                signature:
                  type: string
                  description: The object signature
                typename:
                  type: string
                  description: The type name of the stored object (e.g. vineyard::Tensor, vineyard::DataFrame)
                instance_id:
                  type: integer
                  description: The vineyard instance ID where this object resides
                hostname:
                  type: string
                  description: The hostname of the vineyard instance
            status:
              type: object
              description: LocalObjectStatus defines the observed state of LocalObject
              properties:
                state:
                  type: string
                  description: Current state of the local object
