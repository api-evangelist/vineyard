name: Vineyard
description: >-
  Vineyard (v6d) is an in-memory immutable data manager developed under CNCF TAG-Storage. It provides efficient
  zero-copy data sharing across distributed systems for big data analytics, machine learning, and data-intensive
  workflows. Vineyard enables seamless object sharing between computation engines through a metadata-payload separation
  architecture, supporting Python, C++, Rust, and Go clients. The Vineyard Operator provides Kubernetes-native
  deployment with CRDs for managing clusters, sidecars, backups, and data operations.
