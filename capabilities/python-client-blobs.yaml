naftiko: 1.0.0-alpha2
info:
  label: Vineyard Python Client API — Blobs
  description: 'Vineyard Python Client API — Blobs. 2 operations. Lead operation: Create Blob. Self-contained Naftiko capability
    covering one Vineyard business surface.'
  tags:
  - Vineyard
  - Blobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VINEYARD_API_KEY: VINEYARD_API_KEY
capability:
  consumes:
  - type: http
    namespace: python-client-blobs
    baseUri: ''
    description: Vineyard Python Client API — Blobs business capability. Self-contained, no shared references.
    resources:
    - name: blobs
      path: /blobs
      operations:
      - name: createblob
        method: POST
        description: Create Blob
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: blobs-objectId
      path: /blobs/{objectId}
      operations:
      - name: getblob
        method: GET
        description: Get Blob
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectId
          in: path
          type: string
          required: true
        - name: remote
          in: query
          type: boolean
          description: Retrieve blob from a remote vineyard instance
  exposes:
  - type: rest
    namespace: python-client-blobs-rest
    port: 8080
    description: REST adapter for Vineyard Python Client API — Blobs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/blobs
      name: blobs
      description: REST surface for blobs.
      operations:
      - method: POST
        name: createblob
        description: Create Blob
        call: python-client-blobs.createblob
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/blobs/{objectid}
      name: blobs-objectid
      description: REST surface for blobs-objectId.
      operations:
      - method: GET
        name: getblob
        description: Get Blob
        call: python-client-blobs.getblob
        with:
          objectId: rest.objectId
          remote: rest.remote
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: python-client-blobs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vineyard Python Client API — Blobs. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-blob
      description: Create Blob
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: python-client-blobs.createblob
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-blob
      description: Get Blob
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: python-client-blobs.getblob
      with:
        objectId: tools.objectId
        remote: tools.remote
      outputParameters:
      - type: object
        mapping: $.
