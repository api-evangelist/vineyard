naftiko: 1.0.0-alpha2
info:
  label: Vineyard Python Client API — Names
  description: 'Vineyard Python Client API — Names. 2 operations. Lead operation: Associate Name with Object. Self-contained
    Naftiko capability covering one Vineyard business surface.'
  tags:
  - Vineyard
  - Names
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VINEYARD_API_KEY: VINEYARD_API_KEY
capability:
  consumes:
  - type: http
    namespace: python-client-names
    baseUri: ''
    description: Vineyard Python Client API — Names business capability. Self-contained, no shared references.
    resources:
    - name: names
      path: /names
      operations:
      - name: putname
        method: POST
        description: Associate Name with Object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: names-name
      path: /names/{name}
      operations:
      - name: getbyname
        method: GET
        description: Get Object by Name
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: The human-readable name
          required: true
        - name: wait
          in: query
          type: boolean
          description: Block until the name becomes available
  exposes:
  - type: rest
    namespace: python-client-names-rest
    port: 8080
    description: REST adapter for Vineyard Python Client API — Names. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/names
      name: names
      description: REST surface for names.
      operations:
      - method: POST
        name: putname
        description: Associate Name with Object
        call: python-client-names.putname
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/names/{name}
      name: names-name
      description: REST surface for names-name.
      operations:
      - method: GET
        name: getbyname
        description: Get Object by Name
        call: python-client-names.getbyname
        with:
          name: rest.name
          wait: rest.wait
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: python-client-names-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vineyard Python Client API — Names. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: associate-name-object
      description: Associate Name with Object
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: python-client-names.putname
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-object-name
      description: Get Object by Name
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: python-client-names.getbyname
      with:
        name: tools.name
        wait: tools.wait
      outputParameters:
      - type: object
        mapping: $.
