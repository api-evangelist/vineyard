naftiko: 1.0.0-alpha2
info:
  label: Vineyard Python Client API — Persistence
  description: 'Vineyard Python Client API — Persistence. 1 operations. Lead operation: Persist Object. Self-contained Naftiko
    capability covering one Vineyard business surface.'
  tags:
  - Vineyard
  - Persistence
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VINEYARD_API_KEY: VINEYARD_API_KEY
capability:
  consumes:
  - type: http
    namespace: python-client-persistence
    baseUri: ''
    description: Vineyard Python Client API — Persistence business capability. Self-contained, no shared references.
    resources:
    - name: objects-objectId-persist
      path: /objects/{objectId}/persist
      operations:
      - name: persistobject
        method: POST
        description: Persist Object
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: objectId
          in: path
          type: string
          description: The ObjectID to persist
          required: true
  exposes:
  - type: rest
    namespace: python-client-persistence-rest
    port: 8080
    description: REST adapter for Vineyard Python Client API — Persistence. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/objects/{objectid}/persist
      name: objects-objectid-persist
      description: REST surface for objects-objectId-persist.
      operations:
      - method: POST
        name: persistobject
        description: Persist Object
        call: python-client-persistence.persistobject
        with:
          objectId: rest.objectId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: python-client-persistence-mcp
    port: 9090
    transport: http
    description: MCP adapter for Vineyard Python Client API — Persistence. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: persist-object
      description: Persist Object
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: python-client-persistence.persistobject
      with:
        objectId: tools.objectId
      outputParameters:
      - type: object
        mapping: $.
